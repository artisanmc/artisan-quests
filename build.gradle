plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.2.20' apply false
    id 'io.github.goooler.shadow' version '8.1.7' apply false
}

allprojects {
    // Published to repo.artisanmc.net as net.artisanmc:artisan-quests (the plugin's plain jar),
    // artisan-quests-core and artisan-quests-database: snapshots from master, releases from a tag
    // v<version>, which sets the version with -PpluginVersion (.github/workflows/release.yml).
    group = 'net.artisanmc'
    version = findProperty('pluginVersion') ?: '1.0.0-SNAPSHOT'

    repositories {
        mavenCentral()
        mavenLocal()

        maven {
            name = "papermc-repo"
            url = "https://repo.papermc.io/repository/maven-public/"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/groups/public/"
        }
        maven {
            name = "jitpack"
            url = "https://jitpack.io"
        }
        maven { url = uri("https://repo.tcoded.com/releases") }
    }
}

subprojects {
    apply plugin: 'java'
    // Published so integration plugins (e.g. ArtisanGuildQuests) can compile against ArtisanQuests.
    // Locally: ./gradlew publishToMavenLocal
    apply plugin: 'maven-publish'

    java {
        withSourcesJar()
    }

    def publishedId = project.name == 'bukkit' ? 'artisan-quests' : "artisan-quests-${project.name}"
    publishing {
        publications {
            maven(MavenPublication) {
                artifactId = publishedId
                from components.java
                pom {
                    name = project.name == 'bukkit' ? 'ArtisanQuests' : "ArtisanQuests ${project.name}"
                    description = project.name == 'bukkit'
                            ? 'Quests for Paper, an Artisan add-on (formerly MSQuests): the plugin, without its shaded libraries.'
                            : "Quests for Paper, an Artisan add-on (formerly MSQuests): the ${project.name} module."
                    url = 'https://github.com/artisanmc/artisan-quests'
                    scm {
                        url = 'https://github.com/artisanmc/artisan-quests'
                        connection = 'scm:git:https://github.com/artisanmc/artisan-quests.git'
                    }
                }
            }
        }
        repositories {
            maven {
                name = 'artisanRepo'
                def channel = version.toString().endsWith('SNAPSHOT') ? 'snapshots' : 'releases'
                url = uri("https://repo.artisanmc.net/${channel}")
                credentials {
                    username = providers.gradleProperty('artisanRepoUsername').orNull
                    password = providers.gradleProperty('artisanRepoPassword').orNull
                }
            }
        }
    }

    def targetJavaVersion = 21
    java {
        def javaVersion = JavaVersion.toVersion(targetJavaVersion)
        sourceCompatibility = javaVersion
        targetCompatibility = javaVersion
        if (JavaVersion.current() < javaVersion) {
            toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ["-parameters"]

        if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
            options.release.set(targetJavaVersion)
        }
    }

    tasks.named('test', Test) {
        useJUnitPlatform()

        maxHeapSize = '1G'

        testLogging {
            events("passed", "skipped", "failed")
            exceptionFormat = 'full'
            showExceptions = true
            showCauses = true
            showStackTraces = true
        }
    }

    dependencies {
        testImplementation("org.junit.jupiter:junit-jupiter:5.12.1")
        testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    }
}