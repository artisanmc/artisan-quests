name: Publish

# net.artisanmc:artisan-quests, artisan-quests-core and artisan-quests-database on repo.artisanmc.net,
# like the Artisan API and the other add-ons:
# - push to master: snapshot (the version of build.gradle, ending in -SNAPSHOT) on /snapshots;
# - tag v<version>: release <version> on /releases, and artisanquests-<version>.jar on a draft
#   GitHub Release, published by hand once checked (notes: the tag's annotation, git tag -a).
# Needs the secrets ARTISAN_REPO_USERNAME and ARTISAN_REPO_PASSWORD.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$' || { echo "bad version '$VERSION'" >&2; exit 1; }
            echo "args=-PpluginVersion=$VERSION" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(bash ./gradlew properties -q --no-daemon | awk '/^version:/ {print $2}')"
            echo "$VERSION" | grep -q -- '-SNAPSHOT$' || { echo "master must carry a -SNAPSHOT version, not '$VERSION'" >&2; exit 1; }
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      # Repository tests use Testcontainers (MySQL); the runner provides Docker.
      - name: Build and test
        run: bash ./gradlew build ${{ steps.version.outputs.args }} --no-daemon
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
      - name: Publish to repo.artisanmc.net
        env:
          ORG_GRADLE_PROJECT_artisanRepoUsername: ${{ secrets.ARTISAN_REPO_USERNAME }}
          ORG_GRADLE_PROJECT_artisanRepoPassword: ${{ secrets.ARTISAN_REPO_PASSWORD }}
        run: bash ./gradlew publishMavenPublicationToArtisanRepoRepository ${{ steps.version.outputs.args }} --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: artisanquests-${{ steps.version.outputs.version }}
          path: bukkit/build/libs/artisanquests-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error
      - name: Draft GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          gh release create "$GITHUB_REF_NAME" "bukkit/build/libs/artisanquests-$VERSION.jar" --draft --verify-tag \
            --title "ArtisanQuests $VERSION" --notes "${notes:-artisanquests-$VERSION.jar}"
