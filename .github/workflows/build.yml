name: Build

# Pull requests only: pushes to artisanquests and tags v<version> build, test and publish in release.yml.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The version of build.gradle (a -SNAPSHOT).
      - name: Resolve version
        id: version
        run: echo "value=$(bash ./gradlew properties -q --no-daemon | awk '/^version:/ {print $2}')" >> "$GITHUB_OUTPUT"

      # Repository tests use Testcontainers (MySQL); the runner provides Docker.
      - name: Build and test
        run: bash ./gradlew --no-daemon build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

      - uses: actions/upload-artifact@v4
        with:
          name: artisanquests-${{ steps.version.outputs.value }}
          path: bukkit/build/libs/artisanquests-*.jar
